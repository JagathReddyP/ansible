- name: create ec2 servers and r53 records
  hosts: local
  connection: local #we dont need become:yes because we are not installing anything we are just connecting
  vars:
    subnet_id: "subnet-080356a988c290184"
    sg_id: "sg-04ba9fcd3b0e49e39"
    ami_id: "ami-0220d79f3f480ecf5"
    zone: jagathlearn.art 
    instances:
    - mysql
    - backend
    - frontend
  tasks:
  - name: ansible to install boto3 and botocore
    ansible.builtin.pip:
     name:
      - boto3
      - botocore
     executable: pip3.9

  - name: create ec2 instance
    amazon.aws.ec2_instance:
     name: "{{ item }}"
     vpc_subnet_id: "{{subnet_id}}"
     instance_type: "t3.micro"
     security_group: "{{ sg_id }}"
     image_id: "{{ ami_id }}"
    loop: "{{ instances }}"
    register: ec2_instances

  - name: print the output
    ansible.builtin.debug:
     msg: " {{ ec2_instances }}"

# private ip address
  - name: create private r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ item.item }}.{{ zone }}" #mysql.jagathlearn.art
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: True
      overwrite: true
    loop: "{{ ec2_instances.results }}"

 # we only create public ip for frontend
  - name: create r53 public record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ zone }}" #jagathlearn.art
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: True
      overwrite: true
    loop: "{{ ec2_instances.results }}"
    when: item.item == "frontend" 